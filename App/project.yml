name: Stash
options:
  bundleIdPrefix: dev.dmitryschab
  deploymentTarget:
    iOS: "17.0"
packages:
  TikTokBrainKit:
    path: ../TikTokBrainKit
targets:
  Stash:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Local tooling (ruflo/agentdb) drops a ruvector.db into Sources, and the bare glob
      # copied all 1.5 MB of it to the root of every built .app. Excluding the extension
      # rather than the one filename means the next stray database is caught too.
      - path: Sources
        excludes: ["**/*.db"]
      - Resources
      # The privacy manifest has to sit at the bundle root, so it is listed on its own
      # instead of living under Resources/ (which would nest it in the copied folder).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TikTokBrainKit
      # Embeds the share extension in the app bundle.
      - target: StashShare
    # Sign in with Apple is the only auth method; without this entitlement the
    # ASAuthorizationController request fails at runtime (error 1000).
    entitlements:
      path: Stash.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # The share extension's only channel into the app; see SharedInbox.
        com.apple.security.application-groups: [group.dev.dmitryschab.Stash]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stash
        # Drive the app version/build from MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # below; without these the generated Info.plist hardcodes 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Model-box endpoints (Tailscale / local shim) are plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS — skips the export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        # Import continues in background windows granted by BGTaskScheduler.
        UIBackgroundModes: [processing]
        BGTaskSchedulerPermittedIdentifiers: [dev.dmitryschab.Stash.process]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dmitryschab.Stash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "20"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: S76KJ8Y6C3  # personal team (Dmitrijs Sabelniks) — hosts Orivox too
        CODE_SIGN_STYLE: Automatic

  # The share sheet entry point. Writes the shared link into the app-group inbox and quits;
  # everything else happens in the app (PipelineCenter.drainSharedInbox). Version and build
  # must track the app's exactly or App Store Connect refuses the upload.
  StashShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ShareExtension
    dependencies:
      - package: TikTokBrainKit
    entitlements:
      path: ShareExtension/StashShare.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.dmitryschab.Stash]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Stash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A single web URL, plus text: TikTok's own sheet often hands the caption and the
            # link over together as plain text rather than as a bare URL.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dmitryschab.Stash.Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "20"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: S76KJ8Y6C3
        CODE_SIGN_STYLE: Automatic
