name: Stash
options:
  bundleIdPrefix: dev.dmitryschab
  deploymentTarget:
    iOS: "17.0"
packages:
  TikTokBrainKit:
    path: ../TikTokBrainKit
  # TikTok sign-in (Settings → TikTok). Opens the TikTok app when installed and the SDK's own
  # in-app browser when not. The app target only: the Kit and the share extension never see it.
  TikTokOpenSDK:
    url: https://github.com/tiktok/tiktok-opensdk-ios
    from: 2.5.0
targets:
  Stash:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # Local tooling (ruflo/agentdb) drops a ruvector.db into Sources, and the bare glob
      # copied all 1.5 MB of it to the root of every built .app. Excluding the extension
      # rather than the one filename means the next stray database is caught too.
      - path: Sources
        excludes: ["**/*.db"]
      - Resources
      # The privacy manifest has to sit at the bundle root, so it is listed on its own
      # instead of living under Resources/ (which would nest it in the copied folder).
      - path: PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: TikTokBrainKit
      - package: TikTokOpenSDK
        product: TikTokOpenAuthSDK
      # `TikTokURLHandler` lives here, and the SDK's README has apps link it alongside Auth.
      - package: TikTokOpenSDK
        product: TikTokOpenSDKCore
      # Embeds the share extension in the app bundle.
      - target: StashShare
    # Sign in with Apple is the only auth method; without this entitlement the
    # ASAuthorizationController request fails at runtime (error 1000).
    #
    # ShazamKit (the deep pass's music ID) is deliberately absent: it is an App Services
    # checkbox on the App ID, not a capability, and there is no matching entitlement key —
    # `com.apple.developer.shazamkit` is not a real one, and adding it breaks automatic
    # signing ("entitlement not found and could not be included in profile"). Enable
    # ShazamKit under App Services for dev.dmitryschab.Stash in the developer portal; the
    # framework needs nothing here, and file matching needs no microphone permission.
    entitlements:
      path: Stash.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        # The share extension's only channel into the app; see SharedInbox.
        com.apple.security.application-groups: [group.dev.dmitryschab.Stash]
        # TikTok only accepts an https redirect URI, so the in-app browser's return to
        # https://stash.dmitrijs.dev/tiktok/callback has to open the app as a universal link.
        # The site serves the matching apple-app-site-association file.
        com.apple.developer.associated-domains: ["applinks:stash.dmitrijs.dev"]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Stash
        # Drive the app version/build from MARKETING_VERSION / CURRENT_PROJECT_VERSION
        # below; without these the generated Info.plist hardcodes 1.0 (1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Model-box endpoints (Tailscale / local shim) are plain http.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Only standard HTTPS — skips the export-compliance question per build.
        ITSAppUsesNonExemptEncryption: false
        # Import continues in background windows granted by BGTaskScheduler. Two identifiers,
        # because the two jobs want opposite conditions: `.process` finishes an import the user
        # started and must not wait for a charger, while `.deeppass` deepens the whole library
        # and asks for external power (PipelineCenter.scheduleDeepPassProcessing). `.refresh`
        # is the third: a seconds-long poll of the box while the app is closed, so a finished
        # cloud import ends in a notification (PipelineCenter.scheduleCloudRefresh) and a
        # connected TikTok keeps syncing (PipelineCenter.syncTikTok).
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - dev.dmitryschab.Stash.process
          - dev.dmitryschab.Stash.deeppass
          - dev.dmitryschab.Stash.refresh
        # TikTok sign-in. The SDK reads the client key from here, the TikTok app returns to the
        # client-key URL scheme, and the three query schemes are how the SDK tells whether the
        # TikTok app is installed. The key is public by design; the secret stays on the box.
        TikTokClientKey: $(TIKTOK_CLIENT_KEY)
        # What Settings → TikTok asks for; TikTokConnectSection reads it instead of a literal.
        TikTokScopes: $(TIKTOK_SCOPES)
        # "Continue with TikTok" on the sign-in screen (TikTokLogin.signInEnabled); Debug always.
        TikTokSignIn: $(TIKTOK_SIGN_IN)
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(TIKTOK_CLIENT_KEY)]
        LSApplicationQueriesSchemes: [tiktokopensdk, snssdk1180, snssdk1233]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dmitryschab.Stash
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "56"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: S76KJ8Y6C3  # personal team (Dmitrijs Sabelniks) — hosts Orivox too
        CODE_SIGN_STYLE: Automatic
        # The sandbox "Stash iOS" app's client key until P2 switches to production credentials.
        TIKTOK_CLIENT_KEY: sbawv73l08u684eumu
        # Comma-separated. The sandbox has no portability scopes, so this stays at the basic one
        # until the production key goes in; then add
        # portability.activity.single,portability.activity.ongoing (the P2 sync).
        TIKTOK_SCOPES: user.info.basic
        # YES once TikTok approves Login Kit and the production key is in. Before that only the
        # sandbox's target users can sign in, and a button that fails for App Review is a 2.1
        # rejection.
        TIKTOK_SIGN_IN: NO

  # The share sheet entry point. Writes the shared link into the app-group inbox and quits;
  # everything else happens in the app (PipelineCenter.drainSharedInbox). Version and build
  # must track the app's exactly or App Store Connect refuses the upload.
  StashShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - ShareExtension
    dependencies:
      - package: TikTokBrainKit
    entitlements:
      path: ShareExtension/StashShare.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.dmitryschab.Stash]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Stash
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # A single web URL, plus text: TikTok's own sheet often hands the caption and the
            # link over together as plain text rather than as a bare URL.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dmitryschab.Stash.Share
        MARKETING_VERSION: "1.4"
        CURRENT_PROJECT_VERSION: "56"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: S76KJ8Y6C3
        CODE_SIGN_STYLE: Automatic

schemes:
  Stash:
    build:
      targets:
        Stash: all
    run:
      config: Debug
      # Lets the paywall be exercised in the simulator with no App Store Connect round trip:
      # the product, its price and a purchase all resolve locally. Debug-only by construction
      # — a scheme is not shipped, so a Release archive never sees this file.
      storeKitConfiguration: Stash.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
